<app-header title="Ventas" [showSearch]="false" (addEvent)="goToCreate()"></app-header>

<ion-content [fullscreen]="true" class="sl-content">

  <!-- ── Filtros ─────────────────────────────────────────────────────────── -->
  <div class="sl-filter-strip">
    <div class="sl-searchbar-wrap">
      <ion-icon name="search-outline"></ion-icon>
      <ion-searchbar
        [value]="searchTerm()"
        (ionInput)="onSearch($event)"
        placeholder="Buscar por folio, nombre o nicho"
        debounce="500">
      </ion-searchbar>
    </div>

    <div class="sl-filters">
      <button class="sl-chip" [class.active]="statusFilter() === 'all'"
        (click)="statusFilter.set('all')">Todas</button>
      <button class="sl-chip" [class.active]="statusFilter() === 'active'"
        (click)="statusFilter.set('active')">Activas</button>
      <button class="sl-chip" [class.active]="statusFilter() === 'overdue'"
        (click)="statusFilter.set('overdue')">Vencidas</button>
      <button class="sl-chip" [class.active]="statusFilter() === 'paid'"
        (click)="statusFilter.set('paid')">Pagadas</button>
      <button class="sl-chip" [class.active]="statusFilter() === 'cancelled'"
        (click)="statusFilter.set('cancelled')">Canceladas</button>
    </div>
  </div>

  <!-- ── Loading ─────────────────────────────────────────────────────────── -->
  <div class="sl-loading" *ngIf="loading()">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando ventas…</p>
  </div>

  <!-- ── Grid de ventas ──────────────────────────────────────────────────── -->
  <div class="sl-grid" *ngIf="!loading() && filteredSales().length > 0">
    <div class="sl-card" *ngFor="let sale of filteredSales()" (click)="goToDetail(sale._id)">

      <!-- Cabecera: Folio + Badge -->
      <div class="sl-card-head">
        <div class="sl-folio-block">
          <ion-icon name="cash-outline" class="sl-folio-icon"></ion-icon>
          <div>
            <div class="sl-folio">{{ sale.folio }}</div>
            <div class="sl-date">{{ sale.createdAt | date:'dd/MM/yyyy' }}</div>
          </div>
        </div>
        <span [class]="'sl-badge ' + sale.status">{{ getStatusLabel(sale.status) }}</span>
      </div>

      <!-- Cuerpo -->
      <div class="sl-card-body">
        <div class="sl-info-row">
          <span class="sl-info-label">
            <ion-icon name="person-outline"></ion-icon>Cliente
          </span>
          <span class="sl-info-value">{{ getCustomerName(sale) }}</span>
        </div>

        <div class="sl-info-row">
          <span class="sl-info-label">
            <ion-icon name="business-outline"></ion-icon>Nicho
          </span>
          <span class="sl-info-value">{{ getNicheCode(sale) }}</span>
        </div>

        <div class="sl-info-row highlight">
          <span class="sl-info-label">Total</span>
          <span class="sl-info-value">{{ sale.totalAmount | currencyMx }}</span>
        </div>

        <div class="sl-info-row">
          <span class="sl-info-label">Saldo</span>
          <span class="sl-info-value"
            [class.balance-ok]="sale.balance === 0"
            [class.balance-due]="sale.balance > 0">
            {{ sale.balance | currencyMx }}
          </span>
        </div>

        <!-- Progreso -->
        <div class="sl-progress-row">
          <div class="sl-progress-header">
            <span>Progreso de pagos</span>
            <span class="sl-progress-pct">{{ getProgress(sale) }}%</span>
          </div>
          <div class="sl-seg-bar">
            <div *ngIf="getDownPaymentProgress(sale) > 0" class="sl-seg-dp"
              [style.width.%]="getDownPaymentProgress(sale)"></div>
            <div *ngIf="getInstallmentsProgress(sale) > 0" class="sl-seg-inst"
              [style.width.%]="getInstallmentsProgress(sale)"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ── Empty state ─────────────────────────────────────────────────────── -->
  <app-empty-state
    *ngIf="!loading() && filteredSales().length === 0"
    icon="cash-outline"
    [title]="searchTerm() ? 'No se encontraron ventas' : 'No hay ventas registradas'"
    [message]="searchTerm() ? 'Intenta con otro término de búsqueda' : 'Comienza registrando tu primera venta'"
    [showButton]="!searchTerm()"
    buttonText="Nueva venta"
    (action)="goToCreate()">
  </app-empty-state>

  <!-- ── FAB ─────────────────────────────────────────────────────────────── -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="goToCreate()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
