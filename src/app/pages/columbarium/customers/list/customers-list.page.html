<app-header title="Clientes" [showSearch]="false" [showAdd]="false"></app-header>

<ion-content [fullscreen]="true" class="customers-content">

  <!-- Loading -->
  <div class="cl-loading" *ngIf="loading()">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando clientes…</p>
  </div>

  <div class="cl-wrapper" *ngIf="!loading()">

    <!-- Toolbar -->
    <div class="cl-toolbar">
      <ion-searchbar
        [value]="searchTerm()"
        (ionInput)="onSearch($event)"
        placeholder="Buscar cliente…"
        [debounce]="300"
        class="cl-searchbar">
      </ion-searchbar>

      <div class="cl-filter-tabs">
        <button class="cl-tab" [class.active]="statusFilter() === 'all'" (click)="goToFilter('all')">
          Todos
          <span class="cl-tab-count">{{ customers().length }}</span>
        </button>
        <button class="cl-tab" [class.active]="statusFilter() === 'active'" (click)="goToFilter('active')">
          Activos
        </button>
        <button class="cl-tab" [class.active]="statusFilter() === 'inactive'" (click)="goToFilter('inactive')">
          Inactivos
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="cl-table-wrap" *ngIf="filteredCustomers().length > 0">
      <table class="cl-table">
        <thead>
          <tr>
            <th class="col-avatar"></th>
            <th>Cliente</th>
            <th class="col-phone">Teléfono</th>
            <th class="col-rfc">RFC</th>
            <th class="col-status">Estado</th>
            <th class="col-arrow"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let customer of filteredCustomers(); trackBy: trackByFn"
            (click)="goToDetail(customer._id)"
            class="cl-row">
            <td class="col-avatar">
              <div class="cl-avatar">
                {{ customer.firstName[0] }}{{ customer.lastName[0] }}
              </div>
            </td>
            <td>
              <span class="cl-name">{{ customer.firstName }} {{ customer.lastName }}</span>
            </td>
            <td class="col-phone">
              <span class="cl-phone">{{ customer.phone }}</span>
            </td>
            <td class="col-rfc">
              <span class="cl-rfc" *ngIf="customer.rfc">{{ customer.rfc }}</span>
              <span class="cl-empty" *ngIf="!customer.rfc">—</span>
            </td>
            <td class="col-status">
              <span class="cl-badge"
                [class.active]="customer.active"
                [class.inactive]="!customer.active">
                {{ customer.active ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
            <td class="col-arrow">
              <ion-icon name="chevron-forward-outline" class="cl-chevron"></ion-icon>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Empty state -->
    <app-empty-state
      *ngIf="filteredCustomers().length === 0"
      icon="people-outline"
      title="Sin clientes"
      [message]="searchTerm() ? 'No hay resultados para tu búsqueda' : 'No hay clientes registrados'">
    </app-empty-state>

  </div>

  <!-- FAB -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button color="success" (click)="goToCreate()" title="Nuevo Cliente">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
