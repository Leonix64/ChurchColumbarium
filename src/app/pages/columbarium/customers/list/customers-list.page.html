<app-header title="Clientes"></app-header>

<ion-content [fullscreen]="true">

  <div class="search-filter-bar">
    <ion-searchbar
      placeholder="Buscar cliente..."
      (ionInput)="onSearch($event)"
      [debounce]="300">
    </ion-searchbar>

    <ion-segment [value]="statusFilter()" (ionChange)="onFilterChange($event)">
      <ion-segment-button value="all">
        <ion-label>Todos</ion-label>
      </ion-segment-button>
      <ion-segment-button value="active">
        <ion-label>Activos</ion-label>
      </ion-segment-button>
      <ion-segment-button value="inactive">
        <ion-label>Inactivos</ion-label>
      </ion-segment-button>
    </ion-segment>
  </div>

  <!-- Loading -->
  <div class="loading-container" *ngIf="loading()">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <!-- Empty State -->
  <app-empty-state
    *ngIf="!loading() && filteredCustomers().length === 0"
    icon="people-outline"
    title="Sin clientes"
    description="No se encontraron clientes">
  </app-empty-state>

  <!-- List -->
  <ion-list *ngIf="!loading() && filteredCustomers().length > 0">
    <ion-item
      *ngFor="let customer of filteredCustomers(); trackBy: trackByFn"
      button
      detail="false"
      (click)="goToDetail(customer._id)">
      <ion-avatar slot="start">
        <ion-icon name="person-circle-outline" class="avatar-icon"></ion-icon>
      </ion-avatar>
      <ion-label>
        <h2>{{ customer.firstName }} {{ customer.lastName }}</h2>
        <p>{{ customer.phone }}</p>
        <p *ngIf="customer.rfc">RFC: {{ customer.rfc }}</p>
      </ion-label>
      <ion-badge slot="end" [color]="customer.active ? 'success' : 'medium'">
        {{ customer.active ? 'Activo' : 'Inactivo' }}
      </ion-badge>
      <ion-icon slot="end" name="chevron-forward-outline"></ion-icon>
    </ion-item>
  </ion-list>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="goToCreate()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
