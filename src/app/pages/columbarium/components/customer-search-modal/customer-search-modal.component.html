<ion-header>
  <ion-toolbar>
    <ion-title>Seleccionar Cliente</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar [value]="searchTerm()" (ionInput)="onSearch($event)"
      placeholder="Buscar por nombre, teléfono, email o RFC" debounce="0" animated>
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="loading-container" *ngIf="loading() && customers().length === 0">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Buscando clientes...</p>
  </div>

  <ion-list *ngIf="customers().length > 0">
    <ion-item *ngFor="let customer of customers()" button (click)="selectCustomer(customer)" detail>

      <ion-avatar slot="start">
        <ion-icon name="person-circle-outline"></ion-icon>
      </ion-avatar>

      <ion-label>
        <h2>{{ customer.firstName }} {{ customer.lastName }}</h2>
        <p>
          <ion-icon name="call-outline"></ion-icon>
          {{ customer.phone }}
        </p>
        <p *ngIf="customer.email">
          <ion-icon name="mail-outline"></ion-icon>
          {{ customer.email }}
        </p>
        <p *ngIf="customer.rfc">
          <strong>RFC:</strong>
          {{ customer.rfc }}
        </p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-infinite-scroll *ngIf="hasMore() && customers().length > 0" (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content loadingSpinner="crescent" loadingText="Cargando más clientes...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>

  <!-- Empty state -->
  <div class="empty-state" *ngIf="!loading() && customers().length === 0">
    <ion-icon name="person-circle-outline"></ion-icon>
    <h3>No se encontraron clientes</h3>
    <p>Intenta con otro término de búsqueda</p>
  </div>
</ion-content>
